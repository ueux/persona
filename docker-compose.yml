services:

  postgres:
    image: postgres:17
    container_name: persona-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: persona
      POSTGRES_PASSWORD: persona_dev
      POSTGRES_DB: persona
    ports:
      - "5432:5432"
    volumes:
      - persona_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U persona -d persona"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: persona-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - persona_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  persona_postgres_data:
  persona_redis_data: